<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalle | GameLog</title>
    <meta name="description"
          content="Consulta las fichas de videojuegos en GameLog, con información sobre el género, el año y la descripción de cada juego.">
    <link rel="stylesheet" href="assets/css/estilos.css">
    <link rel="icon" href="assets/img/favicon.svg?v=2" type="image/svg+xml">
    <script src="assets/js/detalle.js" defer></script>
</head>
<body>
    <a class="skip-link" href="#contenido">Saltar al contenido</a>
    <header class="site-header">
        <div class="container header-inner">
            <a class="brand" href="index.html">GameLog</a>
            <nav aria-label="Navegación principal">
                <ul class="nav-list">
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="catalogo.html">Catálogo</a></li>
                    <li><a href="detalle.html" aria-current="page">Detalle</a></li>
                    <li><a href="gestion.html">Mi biblioteca</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <main id="contenido" class="container page-content" tabindex="-1">
        <a class="text-link back-link" href="catalogo.html"><span aria-hidden="true">←</span> Volver al catálogo</a>
        <noscript>
            <h1>Ficha del videojuego</h1>
            <p>Activa JavaScript para abrir la ficha o vuelve al catálogo para consultar los datos básicos.</p>
        </noscript>
        <p id="estado-detalle" class="status" role="status" aria-live="polite">Cargando ficha del videojuego…</p>
        <div id="ficha-no-encontrada" hidden>
            <h1>Ficha no encontrada</h1>
            <p>Elige un videojuego del catálogo para ver sus datos.</p>
        </div>

        <template id="plantilla-ficha">
            <article class="game-detail">
                <img class="detail-cover" src="assets/img/elden-ring-detalle.jpg" alt="" width="300" height="450">
                <div class="detail-body">
                    <h1 data-titulo>Ficha del videojuego</h1>
                    <dl class="detail-facts">
                        <div><dt>Género</dt><dd data-genero></dd></div>
                        <div><dt>Plataforma</dt><dd data-plataforma></dd></div>
                        <div><dt>Año de lanzamiento</dt><dd data-anio></dd></div>
                    </dl>
                    <section class="detail-description" aria-labelledby="descripcion">
                        <h2 id="descripcion">Descripción</h2>
                        <p data-descripcion></p>
                    </section>
                    <a class="button" href="gestion.html">Ir a mi biblioteca <span aria-hidden="true">→</span></a>
                </div>
            </article>
        </template>
    </main>

    <footer class="site-footer">
        <div class="container footer-inner">
            <span class="brand">GameLog</span>
            <p>Proyecto de Diseño de Interfaces Web</p>
        </div>
    </footer>
</body>
</html>
